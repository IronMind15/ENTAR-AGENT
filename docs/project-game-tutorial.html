<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恩特小助手 · 终端冒险</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #c0c0d0;
    font-family: "JetBrains Mono", "Fira Code", "Noto Sans SC", monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .terminal {
    width: 100%;
    max-width: 820px;
    height: min(90vh, 700px);
    background: #0f0f1a;
    border: 1px solid #2a2a4a;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  /* Title bar */
  .term-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #1a1a2e;
    border-bottom: 1px solid #2a2a4a;
    flex-shrink: 0;
  }
  .term-dot {
    width: 12px; height: 12px; border-radius: 50%;
  }
  .term-dot.r { background: #ef476f; }
  .term-dot.y { background: #ffd166; }
  .term-dot.g { background: #06d6a0; }
  .term-title {
    flex: 1;
    text-align: center;
    font-size: .82em;
    color: #606080;
  }
  /* Output area */
  .term-output {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    font-size: .9em;
    line-height: 1.7;
    scroll-behavior: smooth;
  }
  .term-output::-webkit-scrollbar { width: 6px; }
  .term-output::-webkit-scrollbar-track { background: transparent; }
  .term-output::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
  /* Input area */
  .term-input-area {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #2a2a4a;
    background: #0a0a15;
    flex-shrink: 0;
  }
  .term-prompt {
    color: #4cc9f0;
    font-weight: 700;
    white-space: nowrap;
  }
  .term-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #e0e0f0;
    font-family: inherit;
    font-size: .9em;
    outline: none;
  }
  .term-input::placeholder { color: #404060; }
  /* Output styling */
  .out { margin-bottom: 6px; }
  .out.system { color: #606080; font-style: italic; }
  .out.narrator { color: #b0b0d0; }
  .out.highlight { color: #4cc9f0; font-weight: 700; }
  .out.success { color: #06d6a0; }
  .out.error { color: #ef476f; }
  .out.info { color: #ffd166; }
  .out.code {
    background: #0a0a15;
    border: 1px solid #1a1a2e;
    border-radius: 6px;
    padding: 8px 12px;
    margin: 4px 0;
    font-size: .85em;
    color: #4cc9f0;
  }
  .out.code .cmt { color: #606080; }
  .out.code .var { color: #f75a9f; }
  .out.code .key { color: #ffd166; }
  .out.divider {
    text-align: center;
    color: #2a2a4a;
    margin: 12px 0;
    letter-spacing: 4px;
  }
  /* Buttons */
  .choice-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0;
  }
  .choice-btn {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 10px 16px;
    color: #b0b0d0;
    font-family: inherit;
    font-size: .85em;
    text-align: left;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .choice-btn:hover {
    border-color: #4361ee;
    color: #e0e0f0;
    background: #1a1a3e;
  }
  .choice-btn .key {
    background: #2a2a4a;
    color: #606080;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: .8em;
    flex-shrink: 0;
  }
  .choice-btn.correct {
    border-color: #06d6a0;
    background: rgba(6,214,160,.1);
    color: #06d6a0;
  }
  .choice-btn.wrong {
    border-color: #ef476f;
    background: rgba(239,71,111,.1);
    color: #ef476f;
  }
  .choice-btn:disabled { cursor: default; opacity: .7; }
  .choice-btn:disabled:hover { border-color: #2a2a4a; background: #1a1a2e; }
  .choice-btn.correct:disabled:hover { border-color: #06d6a0; background: rgba(6,214,160,.1); }
  .choice-btn.wrong:disabled:hover { border-color: #ef476f; background: rgba(239,71,111,.1); }
  /* Score */
  .score-bar {
    display: flex;
    gap: 20px;
    padding: 6px 16px;
    background: #0a0a15;
    border-top: 1px solid #1a1a2e;
    font-size: .75em;
    color: #404060;
    flex-shrink: 0;
  }
  .score-bar span { display: flex; align-items: center; gap: 4px; }
  .score-bar .val { color: #9090b0; font-weight: 700; }

  /* typewriter cursor */
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  .cursor { animation: blink 1s step-end infinite; }

  /* Status indicators */
  .badge {
    display: inline-block;
    font-size: .7em;
    padding: 1px 8px;
    border-radius: 4px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .badge.right { background: rgba(6,214,160,.15); color: #06d6a0; }
  .badge.wrong { background: rgba(239,71,111,.15); color: #ef476f; }
  .badge.info { background: rgba(76,201,240,.15); color: #4cc9f0; }
  .badge.achieve { background: rgba(255,209,102,.15); color: #ffd166; }

  @media (max-width: 600px) {
    .terminal { height: 95vh; border-radius: 8px; }
    .term-output { padding: 12px; font-size: .82em; }
    .choice-btn { font-size: .8em; padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="terminal">
  <div class="term-bar">
    <span class="term-dot r"></span>
    <span class="term-dot y"></span>
    <span class="term-dot g"></span>
    <span class="term-title">恩特小助手 · 开发模拟器 v1.0</span>
  </div>
  <div class="term-output" id="output"></div>
  <div class="term-input-area" id="inputArea" style="display:none">
    <span class="term-prompt">$</span>
    <input class="term-input" id="cmdInput" placeholder="输入命令后按回车..." autofocus>
  </div>
  <div class="score-bar" id="scoreBar">
    <span>🏆 得分: <span class="val" id="scoreVal">0</span></span>
    <span>✅ 正确: <span class="val" id="correctVal">0</span></span>
    <span>❌ 失误: <span class="val" id="wrongVal">0</span></span>
    <span>📍 进度: <span class="val" id="progressVal">0/0</span></span>
  </div>
</div>

<script>
// ===== GAME STATE =====
const state = {
  score: 0,
  correct: 0,
  wrong: 0,
  currentScene: 0,
  totalScenes: 0,
  sceneData: null,
  waitingChoice: false,
  waitingCmd: false,
  cmdResolve: null,
  typingTimer: null,
  isTyping: false,
};

// ===== OUTPUT =====
const out = document.getElementById('output');
function scrollBottom() { out.scrollTop = out.scrollHeight; }

function print(text, cls = 'narrator', raw = false) {
  const div = document.createElement('div');
  div.className = `out ${cls}`;
  if (raw) div.innerHTML = text;
  else div.textContent = text;
  out.appendChild(div);
  scrollBottom();
}

function printHtml(html) {
  print(html, 'narrator', true);
}

function printCode(text) {
  print(text, 'code', true);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typePrint(text, cls = 'narrator', speed = 20) {
  const div = document.createElement('div');
  div.className = `out ${cls}`;
  out.appendChild(div);
  state.isTyping = true;
  for (let i = 0; i < text.length; i++) {
    div.textContent += text[i];
    scrollBottom();
    await wait(speed);
  }
  state.isTyping = false;
  scrollBottom();
  return div;
}

async function typePrintHtml(html, speed = 20) {
  // Strip tags for typing effect on plain text
  const plain = html.replace(/<[^>]*>/g, '');
  return typePrint(plain, 'narrator', speed);
}

// ===== CHOICES =====
function showChoices(choices) {
  state.waitingChoice = true;
  const area = document.createElement('div');
  area.className = 'choice-area';
  area.id = 'choiceArea';

  choices.forEach((c, i) => {
    const label = String.fromCharCode(65 + i); // A, B, C, D
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="key">${label}</span> ${c.text}`;
    btn.dataset.index = i;
    btn.dataset.correct = c.correct || false;
    btn.onclick = () => handleChoice(btn, choices);
    area.appendChild(btn);
  });

  out.appendChild(area);
  scrollBottom();
  return new Promise(resolve => {
    state.choiceResolve = resolve;
  });
}

async function handleChoice(btn, choices) {
  if (!state.waitingChoice) return;
  const idx = parseInt(btn.dataset.index);
  const isCorrect = btn.dataset.correct === 'true';

  // Disable all
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    state.score += 10;
    state.correct++;
    await wait(300);
    print('✅ 正确！+10 分', 'success');
  } else {
    btn.classList.add('wrong');
    state.wrong++;
    // Show correct one
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.dataset.correct === 'true') b.classList.add('correct');
    });
    await wait(300);
    print('❌ 这不是实际的选择，看看正确答案', 'error');
  }
  updateScore();
  state.waitingChoice = false;
  await wait(800);
  if (state.choiceResolve) {
    state.choiceResolve(isCorrect);
    state.choiceResolve = null;
  }
}

// ===== COMMAND INPUT =====
function showCmdInput() {
  state.waitingCmd = true;
  const area = document.getElementById('inputArea');
  area.style.display = 'flex';
  const input = document.getElementById('cmdInput');
  input.value = '';
  input.focus();

  return new Promise(resolve => {
    state.cmdResolve = resolve;
  });
}

function hideCmdInput() {
  document.getElementById('inputArea').style.display = 'none';
  state.waitingCmd = false;
}

document.getElementById('cmdInput').addEventListener('keydown', async (e) => {
  if (e.key === 'Enter' && state.waitingCmd && state.cmdResolve) {
    const val = e.target.value.trim();
    print(`$ ${val}`, 'code', true);
    hideCmdInput();
    state.cmdResolve(val);
    state.cmdResolve = null;
  }
});

// ===== SCORE =====
function updateScore() {
  document.getElementById('scoreVal').textContent = state.score;
  document.getElementById('correctVal').textContent = state.correct;
  document.getElementById('wrongVal').textContent = state.wrong;
}

function updateProgress(current, total) {
  document.getElementById('progressVal').textContent = `${current}/${total}`;
}

// ===== DIVIDER =====
function divider() {
  print('━'.repeat(50), 'divider', true);
}

// ===== SCENES =====
const scenes = [
  // SCENE 0: INTRO
  async function scene0() {
    state.totalScenes = 8;
    updateProgress(0, state.totalScenes);
    print('');
    await wait(300);
    await typePrint('███████╗██╗  ██╗████████╗ █████╗ ██████╗ ', 'highlight', 8);
    await typePrint('╚══██╔══╝██║  ██║╚══██╔══╝██╔══██╗██╔══██╗', 'highlight', 8);
    await typePrint('   ██║   ███████║   ██║   ███████║██████╔╝', 'highlight', 8);
    await typePrint('   ██║   ██╔══██║   ██║   ██╔══██║██╔══██╗', 'highlight', 8);
    await typePrint('   ██║   ██║  ██║   ██║   ██║  ██║██║  ██║', 'highlight', 8);
    await typePrint('   ╚═╝   ╚═╝  ╚═╝   ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝', 'highlight', 8);
    print('');
    await typePrint('🔥 恩特能源 · AI 智能助手开发模拟器', 'highlight', 30);
    await typePrint('═'.repeat(45), 'divider');
    await wait(400);
    print('');

    await typePrint('你是一名刚入职恩特能源的 AI 工程师。', 'narrator', 25);
    await wait(200);
    await typePrint('今天是你第一天上班。胡总把你叫到办公室……', 'narrator', 25);
    await wait(300);
    print('');
    await typePrint('「小李啊，咱们公司做储能变流器（PCS）的，你也知道。」', 'info', 25);
    await wait(150);
    await typePrint('「售后那边天天接到电话——客户报故障代码，工程师翻手册查半天。」', 'info', 25);
    await wait(150);
    await typePrint('「你搞 AI 的，能不能做个东西，让同事在手机上就能查故障代码？」', 'info', 25);
    await wait(300);
    print('');
    await typePrint('你脑子里快速盘算了一下……', 'narrator', 25);
    print('');
    await wait(200);

    print('💡 你想到了几个关键问题：', 'info');
    print('  1. 同事需要随时随地能查——最好在手机上', 'narrator');
    print('  2. 公司没有公网 IP，做 Web 服务外部访问不了', 'narrator');
    print('  3. 公司全员用钉钉——也许可以利用这个', 'narrator');
    print('');
    await wait(300);

    const ok = await showChoices([
      { text: '📱 「胡总，我们接钉钉吧！同事在钉钉上直接查」', correct: true },
      { text: '🌐 「我搭个 Web 网站，同事浏览器访问」', correct: false },
      { text: '📱 + 🌐 「钉钉和 Web 都要，双管齐下」', correct: true },
    ]);

    print('');
    if (ok) {
      await typePrint('胡总眼前一亮：「好！钉钉上查方便，就这个方向。」', 'info', 25);
    } else {
      await typePrint('胡总皱了皱眉：「Web 倒是能用，但同事们还是得来电脑前查……」', 'info', 25);
      await wait(200);
      print('你赶紧补充：「那再加个钉钉机器人，手机上也能查！」', 'narrator');
      await typePrint('胡总点头：「这个好，两个都要。」', 'info', 25);
    }
    print('');
    await wait(200);
    await typePrint('可是……钉钉机器人需要公网 IP，公司没有。', 'narrator', 25);
    await typePrint('你回去调研，发现了钉钉的 Stream Mode——', 'narrator', 25);
    print('');
    await typePrint('💡 核心认知：Stream Mode = 我们主动连钉钉，不是钉钉连我们', 'success', 25);
    await typePrint('   不需要公网 IP、不需要防火墙白名单、不需要 SSL 证书！', 'highlight', 25);
    print('');
    await wait(300);
    print('✅ 目标确认：', 'success');
    print('  · 接收方式 → 钉钉 Stream 模式机器人', 'narrator');
    print('  · Web 页面辅助 → 公司内网访问 localhost:8000', 'narrator');
    print('  · 数据源 → PCS参数表 V1.6.2.xlsx（133 条故障记录）', 'narrator');
    print('');
    await wait(500);
    divider();

    return true;
  },

  // SCENE 1: TWO-LEVEL QUERY
  async function scene1() {
    updateProgress(2, state.totalScenes);
    await wait(300);
    await typePrint('第 2 章 · 核心引擎：两级查询策略', 'highlight', 30);
    print('═'.repeat(45));
    print('');
    await wait(200);

    await typePrint('你拿到了 PCS 参数表，里面有 133 条故障记录。', 'narrator', 25);
    await typePrint('每条记录有：故障代码（d4-1）、名称、原因、地址、位地址……', 'narrator', 25);
    await wait(200);
    print('');
    await typePrint('问题是：用户会怎么查？', 'info', 30);
    await wait(200);
    print('');
    await typePrint('场景 A：老师傅知道故障代码，直接说 "d4-1"', 'narrator', 20);
    await typePrint('场景 B：新同事描述现象 "逆变器报错了，急停信号闭合"', 'narrator', 20);
    print('');
    await wait(200);

    print('📊 你设计了两个查询路径：', 'info');
    print('');
    printCode(`  <span class="key">路径 1：精确匹配</span>  d4-1 → Chroma metadata 过滤 → 直接返回`);

    await typePrint('但有个问题——钉钉不渲染 Markdown 粗体（**xx**），', 'narrator', 25);

    print('');
    await typePrint('💡 改用【】中文括号代替 **，每条内容连续编号', 'success', 25);

    printCode(`1. 【名称】急停告警`);
    printCode(`2. 【故障原因】外部急停信号闭合`);
    printCode(`3. 【故障代码】d4-1`);
    printCode(`...`);
    printCode(`数据来源：PCS参数表 V1.6.2.xlsx → 遥信（DI） → 第51行`);
    print('');
    await wait(300);

    const ok = await showChoices([
      { text: '⚡ 让 LLM 处理所有查询（省事，但慢又贵）', correct: false },
      { text: '🎯 精确匹配 + 语义搜索两条路，LLM 只用在刀刃上', correct: true },
    ]);

    print('');
    if (ok) {
      await typePrint('「对对对！LLM 调用要花钱的，能省则省」——你确定方向', 'info', 25);
      state.score += 10;
    } else {
      await typePrint('还好你想了想……调用一次 API 几毛钱，133 条记录每次调 LLM 太浪费了。', 'info', 25);
      await typePrint('你改成两级策略，精确匹配秒回，语义搜索兜底。', 'narrator', 25);
    }
    print('');
    print('🏆 设计原则确立：LLM 只用在刀刃上，能本地匹配就不调 API', 'success');
    print('');
    await wait(500);
    divider();
    return true;
  },

  // SCENE 2: FIRST SYNC
  async function scene2() {
    updateProgress(3, state.totalScenes);
    await wait(300);
    await typePrint('第 3 章 · 把数据喂给系统', 'highlight', 30);
    print('═'.repeat(45));
    print('');
    await wait(200);

    await typePrint('Excel 数据有了，架构也设计好了。', 'narrator', 25);

    const isCorrect = expectedCmds.some(c => cmd.includes(c));

    if (isCorrect) {
      state.score += 10;
      state.correct++;
      await typePrint('✅ 正确！脚本开始读取 Excel，逐行解析，写入 Chroma……', 'success', 25);
    } else {
      state.wrong++;
      await typePrint(`实际命令是 python scripts/sync_kb.py`, 'error', 25);
      await typePrint('不过没关系，来看看同步过程：', 'narrator', 25);
    }
    print('');
    await wait(200);
    await typePrint('📂 openpyxl 读取 PCS参数表 V1.6.2.xlsx', 'info', 20);
    await typePrint('📄 定位到「遥信（DI）」sheet', 'info', 20);
    await typePrint('📝 逐行解析 → 格式化为结构化记录', 'info', 20);
    await typePrint('💾 写入 Chroma 向量库（BAAI/bge-small-zh-v1.5 嵌入）', 'info', 20);
    await typePrint('', '');
    await typePrint('✅ 同步完成！133 条故障记录已就绪', 'success', 25);
    print('');
    await wait(300);
    await typePrint('现在，当同事在钉钉上发 "d4-1"，系统就能秒回了。', 'narrator', 25);
    print('');
    await wait(200);
    divider();

    // Save for summary
    state.firstSyncCmd = 'python scripts/sync_kb.py';
    return true;
  },

  // SCENE 3: AGENT ROUTING
  async function scene3() {

async function startGame() {
  for (let i = 0; i < scenes.length; i++) {

      console.error('Scene error:', e);
      print(`⚠️ 场景 ${i+1} 出错了，跳过…`, 'error');
    }
  }
}
