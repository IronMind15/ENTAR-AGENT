  }

  }
  .chapter-nav a {
    display: block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #2a2a4a;
    background: transparent;
    transition: all .3s;
    position: relative;
  }
  .chapter-nav a:hover,

    background: #4361ee;
    border-color: #4361ee;
  }
  .chapter-nav a .tip {
    position: absolute;
    right: 20px;
    top: 50%;

    border-radius: 6px;
    border: 1px solid #2a2a4a;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;

  .chapter-nav a.active .tip { opacity: 1; color: #e0e0f0; }

  .chapter {

    flex-direction: column;
    justify-content: center;
    max-width: 880px;
    margin: 0 auto;
    opacity: 0;
    transform: translateY(40px);

  .chapter.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .chapter-number {
    font-size: .8em;
    color: #4361ee;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;

  .chapter-date {
    font-size: .85em;
    color: #606080;
    margin-bottom: 4px;
  }
  .chapter-title {
    font-size: clamp(1.6em, 4vw, 2.4em);
    font-weight: 800;
    margin-bottom: 20px;
    line-height: 1.3;
  }

  .chapter-content {
    font-size: .95em;
    color: #b0b0d0;
  }
  .chapter-content p { margin-bottom: 12px; }

  .insight-card {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px 24px;
    margin: 16px 0;

    font-size: .9em;
    font-weight: 700;
    color: #e0e0f0;

  .tag.feature { background: rgba(6,214,160,.15); color: #06d6a0; }
  .tag.learn { background: rgba(255,209,102,.15); color: #ffd166; }
  .tag.blind { background: rgba(239,71,111,.15); color: #ef476f; }

  .cmd-block {
    background: #0a0a15;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 12px 16px;
    margin: 8px 0;

    color: #4cc9f0;
    overflow-x: auto;
  }

    padding-top: 20px;

    color: #b0b0d0;

  .nav-btn:hover {

    color: #e0e0f0;
    background: #1a1a3e;
  }
  .nav-btn:disabled {
    opacity: .3;

  }
  .nav-btn:disabled:hover {
    border-color: #2a2a4a;
    color: #b0b0d0;
    background: #1a1a2e;
  }
  .chapter-counter {
    font-size: .85em;
    color: #606080;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 20px 0;
  }
  @media (max-width: 640px) {

    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 16px;
  }
  .summary-card h4 {
    font-size: .9em;
    color: #e0e0f0;
    margin-bottom: 10px;
  }

  .summary-card li::before {

    position: absolute;
    left: 0;
    color: #4361ee;
  }

  /* ========== Responsive ========== */
  @media (max-width: 768px) {
    .chapter { padding: 60px 20px 40px; }

    .cover .stats-row { gap: 16px; }
    .chapter-nav-btns { flex-wrap: wrap; gap: 10px; }
    .nav-btn { flex: 1; justify-content: center; }
  }

  /* ========== Step highlight animation ========== */
  .highlight-in {
    animation: highlightIn .8s ease;
  }
  @keyframes highlightIn {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ========== Milestone marker ========== */
  .milestone {
    display: inline-block;
    background: linear-gradient(135deg, #4361ee, #7209b7);
    color: #fff;
    font-size: .7em;
    padding: 3px 12px;
    border-radius: 20px;
    font-weight: 700;
    margin-left: 8px;

  /* ========== Keyboard hint ========== */
  .kbd-hint {

    border: 1px solid #2a2a4a;
    border-radius: 4px;
    padding: 1px 6px;

    font-size: .9em;
  }
</style>
</head>

// ========== STATE ==========
let currentChapter = -1;

// ========== BUILD DOM ==========
function buildChapters() {
  const container = document.getElementById('chaptersContainer');
  const nav = document.getElementById('chapterNav');

  chapters.forEach((ch, i) => {
    // Section
    const sec = document.createElement('section');
    sec.className = 'chapter';
    sec.id = `ch-${i}`;
    sec.innerHTML = `
      <div class="chapter-number">第 ${i + 1} 章</div>
      <div class="chapter-date">${ch.date}</div>
      <div class="chapter-title">${ch.title}</div>
      <div class="tags">${ch.tags.map(t => `<span class="tag ${t}">${tagLabel(t)}</span>`).join('')}</div>
      <div class="chapter-content">${ch.content}</div>
      <div class="chapter-nav-btns">
        <button class="nav-btn" onclick="goTo(${i - 1})" ${i === 0 ? 'disabled' : ''}>← 上一步</button>
        <span class="chapter-counter">${i + 1} / ${chapters.length}</span>
        <button class="nav-btn" onclick="goTo(${i + 1})" ${i === chapters.length - 1 ? 'disabled' : ''}>下一步 →</button>
      </div>
    `;
    container.appendChild(sec);

    // Nav dot
    const dot = document.createElement('a');
    dot.href = `#ch-${i}`;
    dot.id = `dot-${i}`;
    dot.innerHTML = `<span class="tip">${ch.title.replace(/<[^>]*>/g,'').slice(0,20)}</span>`;
    dot.onclick = (e) => { e.preventDefault(); goTo(i); };
    nav.appendChild(dot);
  });
}

function tagLabel(t) {
  const map = { file:'📁 文件', tech:'⚙️ 技术', feature:'🎯 功能', learn:'💡 学到', blind:'⚠️ 盲区' };
  return map[t] || t;
}

// ========== NAVIGATION ==========
function goTo(idx) {
  if (idx < 0 || idx >= chapters.length) return;
  currentChapter = idx;
  document.getElementById(`ch-${idx}`).scrollIntoView({ behavior: 'smooth' });
  updateUI();
}

function updateUI() {
  // Nav dots
  document.querySelectorAll('.chapter-nav a').forEach((a, i) => {
    a.classList.toggle('active', i === currentChapter);
  });
  // Progress
  const pct = ((currentChapter + 1) / chapters.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ========== SCROLL OBSERVER ==========
function setupObserver() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        const idx = parseInt(entry.target.id.split('-')[1]);
        if (!isNaN(idx)) { currentChapter = idx; updateUI(); }
      }
    });
  }, { threshold: 0.4 });

  document.querySelectorAll('.chapter').forEach(el => observer.observe(el));
}

// ========== KEYBOARD ==========
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    goTo(currentChapter + 1);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    goTo(currentChapter - 1);
  }
});

// ========== START ==========
function startJourney() {
  document.getElementById('cover').style.display = 'none';
  goTo(0);
}

// ========== INIT ==========
buildChapters();
setupObserver();

// Show first chapter dots as active initially
updateUI();
</script>
