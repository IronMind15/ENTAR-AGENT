version: "3.8"

services:
  entar-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: entar-agent
    ports:
      - "8000:8000"
    volumes:
      # 代码挂载（修改后 docker restart 即可，无需 --build 重装依赖）
      - ../scripts:/app/scripts
      # 静态源数据只读挂载（Excel/PDF/经验/PCB/评估集）。部署包不携带 data/。
      - ${ENTAR_STATIC_DATA_DIR:-../data}:/app/data:ro
      # 生产运行数据与源码/静态源数据分离：uploads、SQLite、看板文件、日志。
      - ${ENTAR_RUNTIME_HOST_DIR:-../runtime}:/var/lib/entar-agent/runtime
      # Chroma 向量库单独持久化。
      - ${ENTAR_KB_HOST_DIR:-../knowledge_base}:/var/lib/entar-agent/knowledge_base
      - ${ENTAR_LOG_HOST_DIR:-../logs}:/var/log/entar-agent
    environment:
      ENTAR_ENV: production
      ENTAR_RUNTIME_DIR: /var/lib/entar-agent/runtime
      ENTAR_KNOWLEDGE_BASE_DIR: /var/lib/entar-agent/knowledge_base
      ENTAR_LOG_DIR: /var/log/entar-agent
      HF_ENDPOINT: https://hf-mirror.com
    restart: unless-stopped
